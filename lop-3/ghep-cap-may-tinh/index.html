<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ai Nhanh Tay Hơn? — Ghép Cặp Bộ Phận Máy Tính (Lớp 3)</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--red:#ef4444;--redlt:#fee2e2;--blue:#3b82f6;--bluelt:#dbeafe;--green:#22c55e}
    html,body{height:100%}
    body{font-family:'Quicksand',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
        background:#f8fafc;color:#1e293b;display:flex;flex-direction:column;overflow:hidden;
        touch-action:manipulation;user-select:none;-webkit-user-select:none}

    /* Header */
    header{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:8px 12px;z-index:10;
        display:flex;justify-content:space-between;align-items:center;gap:8px}
    .team-tag{padding:4px 16px;border-radius:999px;font-weight:800;color:#fff;font-size:1rem;white-space:nowrap}
    .tag-a{background:var(--red)}.tag-b{background:var(--blue)}
    .side{display:flex;align-items:center;gap:10px}
    .prog{font-size:1.5rem;font-weight:900}
    #progress-a{color:var(--red)}#progress-b{color:var(--blue)}
    .center{text-align:center;flex:1}
    .center h1{font-size:1.15rem;font-weight:900;color:#334155;letter-spacing:-.5px;line-height:1.1}
    .center .sub{font-size:.72rem;color:#94a3b8;font-weight:700;margin-top:1px}
    .ctrls{margin-top:5px;display:flex;gap:6px;justify-content:center}
    .btn{font-size:.8rem;font-weight:700;padding:5px 12px;border-radius:10px;border:none;cursor:pointer;
        background:#e2e8f0;color:#334155;transition:background .15s}
    .btn:hover{background:#cbd5e1}
    .btn:active{transform:scale(.95)}

    /* Boards */
    .arena{display:flex;flex:1;overflow:hidden}
    .zone{flex:1;padding:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .zone-a{background:var(--redlt);border-right:4px dashed #e5e7eb}
    .zone-b{background:var(--bluelt)}
    .board{display:grid;gap:10px;width:100%;height:100%;max-width:640px;max-height:78vh}

    /* Card flip */
    .card{perspective:900px}
    .inner{position:relative;width:100%;height:100%;transition:transform .4s cubic-bezier(.4,0,.2,1);
        transform-style:preserve-3d;cursor:pointer}
    .inner.flip{transform:rotateY(180deg)}
    .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        border-radius:14px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);overflow:hidden}
    .front{font-size:2.4rem;font-weight:900;color:#fff}
    .back{background:#fff;transform:rotateY(180deg);padding:4px;gap:2px}
    .back svg{width:64%;height:auto;max-height:66%}
    .back .nm{font-size:.8rem;font-weight:800;color:#475569;text-align:center;line-height:1}
    .zone-a .front{background:linear-gradient(135deg,#f87171,#ef4444);border:3px solid #fff}
    .zone-a .back{border:3px solid var(--red)}
    .zone-b .front{background:linear-gradient(135deg,#60a5fa,#3b82f6);border:3px solid #fff}
    .zone-b .back{border:3px solid var(--blue)}

    .matched{pointer-events:none!important}
    .matched .back{border-width:5px;border-color:var(--green)!important;box-shadow:0 0 16px rgba(34,197,94,.55)}
    @keyframes bump{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.12)}100%{transform:rotateY(180deg) scale(1)}}
    .bump{animation:bump .45s ease-out}

    /* Modal + confetti */
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
    .modal.show{display:flex}
    .box{background:#fff;padding:34px 40px;border-radius:28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);border:8px solid var(--red);max-width:420px;width:100%}
    .box h2{font-size:2.6rem;font-weight:900;margin-bottom:8px}
    .box .who{font-size:1.5rem;font-weight:800;color:#334155;margin-bottom:10px}
    .box .cup{font-size:4.5rem;margin-bottom:14px}
    .play{background:var(--green);color:#fff;font-size:1.3rem;font-weight:800;padding:14px;border-radius:16px;border:none;width:100%;cursor:pointer;box-shadow:0 6px 0 #16a34a}
    .play:active{transform:translateY(3px);box-shadow:0 3px 0 #16a34a}
    .confetti{position:fixed;top:-20px;width:12px;height:12px;z-index:60;animation:fall linear forwards}
    @keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

    @media(max-width:720px){
        .arena{flex-direction:column}
        .zone-a{border-right:none;border-bottom:4px dashed #e5e7eb}
        .center h1{font-size:.95rem}
        .board{max-height:none}
    }
</style>
</head>
<body>
<header>
    <div class="side">
        <span class="team-tag tag-a">ĐỘI A</span>
        <span id="progress-a" class="prog">0/6</span>
    </div>
    <div class="center">
        <h1>AI NHANH TAY HƠN?</h1>
        <div class="sub">Ghép cặp bộ phận máy tính · Lớp 3</div>
        <div class="ctrls">
            <button class="btn" onclick="resetGame()">↻ Ván mới</button>
            <button class="btn" id="soundBtn" onclick="toggleSound()">🔊 Âm thanh</button>
        </div>
    </div>
    <div class="side">
        <span id="progress-b" class="prog">0/6</span>
        <span class="team-tag tag-b">ĐỘI B</span>
    </div>
</header>

<div class="arena">
    <div class="zone zone-a"><div id="board-a" class="board"></div></div>
    <div class="zone zone-b"><div id="board-b" class="board"></div></div>
</div>

<div class="modal" id="modal">
    <div class="box" id="box">
        <h2 id="mTitle">CHIẾN THẮNG!</h2>
        <div class="who" id="mWho">Đội A về đích trước!</div>
        <div class="cup">🏆</div>
        <button class="play" onclick="resetGame()">CHƠI TIẾP</button>
    </div>
</div>

<script>
/* ===== Bộ phận máy tính (SVG tự vẽ, không cần mạng) ===== */
const PARTS = {
    manhinh:{name:'Màn hình', svg:'<svg viewBox="0 0 100 100"><rect x="12" y="16" width="76" height="52" rx="6" fill="#3b82f6"/><rect x="19" y="23" width="62" height="38" rx="3" fill="#dbeafe"/><rect x="42" y="68" width="16" height="11" fill="#3b82f6"/><rect x="28" y="79" width="44" height="8" rx="4" fill="#2563eb"/></svg>'},
    banphim:{name:'Bàn phím', svg:'<svg viewBox="0 0 100 100"><rect x="8" y="30" width="84" height="40" rx="8" fill="#64748b"/><g fill="#e2e8f0"><rect x="16" y="38" width="9" height="8" rx="2"/><rect x="29" y="38" width="9" height="8" rx="2"/><rect x="42" y="38" width="9" height="8" rx="2"/><rect x="55" y="38" width="9" height="8" rx="2"/><rect x="68" y="38" width="9" height="8" rx="2"/><rect x="16" y="50" width="9" height="8" rx="2"/><rect x="29" y="50" width="9" height="8" rx="2"/><rect x="68" y="50" width="9" height="8" rx="2"/><rect x="32" y="60" width="36" height="7" rx="3"/></g></svg>'},
    chuot:{name:'Chuột', svg:'<svg viewBox="0 0 100 100"><rect x="33" y="18" width="34" height="64" rx="17" fill="#22c55e"/><line x1="50" y1="22" x2="50" y2="46" stroke="#fff" stroke-width="3"/><rect x="47" y="27" width="6" height="12" rx="3" fill="#fff"/></svg>'},
    loa:{name:'Loa', svg:'<svg viewBox="0 0 100 100"><rect x="28" y="12" width="44" height="76" rx="7" fill="#f97316"/><circle cx="50" cy="32" r="9" fill="#fff7ed"/><circle cx="50" cy="62" r="15" fill="#fff7ed"/><circle cx="50" cy="62" r="6" fill="#f97316"/></svg>'},
    mayin:{name:'Máy in', svg:'<svg viewBox="0 0 100 100"><rect x="30" y="14" width="40" height="18" fill="#a78bfa"/><rect x="15" y="32" width="70" height="34" rx="6" fill="#8b5cf6"/><circle cx="73" cy="45" r="3.5" fill="#fde047"/><rect x="30" y="60" width="40" height="26" fill="#fff"/><rect x="30" y="60" width="40" height="4" fill="#c4b5fd"/></svg>'},
    tainghe:{name:'Tai nghe', svg:'<svg viewBox="0 0 100 100"><path d="M22 60 V48 a28 28 0 0 1 56 0 V60" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/><rect x="13" y="54" width="18" height="28" rx="7" fill="#ec4899"/><rect x="69" y="54" width="18" height="28" rx="7" fill="#ec4899"/></svg>'},
    laptop:{name:'Máy tính xách tay', svg:'<svg viewBox="0 0 100 100"><rect x="22" y="22" width="56" height="38" rx="4" fill="#14b8a6"/><rect x="28" y="28" width="44" height="26" rx="2" fill="#ccfbf1"/><path d="M16 60 H84 L92 76 H8 Z" fill="#0d9488"/></svg>'},
    thungmay:{name:'Thùng máy', svg:'<svg viewBox="0 0 100 100"><rect x="30" y="12" width="40" height="76" rx="6" fill="#0ea5e9"/><circle cx="50" cy="24" r="4" fill="#fff"/><rect x="38" y="34" width="24" height="4" rx="2" fill="#e0f2fe"/><rect x="38" y="42" width="24" height="4" rx="2" fill="#e0f2fe"/><rect x="40" y="60" width="20" height="20" rx="3" fill="#38bdf8"/></svg>'}
};
const POOL = ['manhinh','banphim','chuot','loa','mayin','tainghe','laptop','thungmay'];
const CFG = {pick:6, cols:4, rows:3, wrongDelay:1100};

let state = {A:{flipped:[],matched:0,locked:false}, B:{flipped:[],matched:0,locked:false}};
let roundKeys = [];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function initGame(){
    document.getElementById('board-a').style.gridTemplateColumns='repeat('+CFG.cols+',1fr)';
    document.getElementById('board-b').style.gridTemplateColumns='repeat('+CFG.cols+',1fr)';
    document.getElementById('board-a').style.gridTemplateRows='repeat('+CFG.rows+',1fr)';
    document.getElementById('board-b').style.gridTemplateRows='repeat('+CFG.rows+',1fr)';
    roundKeys = shuffle([...POOL]).slice(0, CFG.pick);   // cùng bộ hình cho cả 2 đội (công bằng)
    renderBoard('A','board-a');
    renderBoard('B','board-b');
    state = {A:{flipped:[],matched:0,locked:false}, B:{flipped:[],matched:0,locked:false}};
    updateProgress();
    document.getElementById('modal').classList.remove('show');
}

function renderBoard(team, boardId){
    const board = document.getElementById(boardId);
    board.innerHTML='';
    const deck = shuffle([...roundKeys, ...roundKeys]);
    deck.forEach(key=> board.appendChild(createCard(team, key)));
}

function createCard(team, key){
    const p = PARTS[key];
    const card = document.createElement('div');
    card.className='card';
    const inner = document.createElement('div');
    inner.className='inner';
    inner.dataset.key = key;
    inner.innerHTML =
        '<div class="face front">?</div>'+
        '<div class="face back">'+p.svg+'<span class="nm">'+p.name+'</span></div>';
    inner.addEventListener('pointerdown', e=>{e.preventDefault(); handleClick(team, inner);});
    card.appendChild(inner);
    return card;
}

function handleClick(team, card){
    const s = state[team];
    if(s.locked || card.classList.contains('flip') || card.classList.contains('matched')) return;
    card.classList.add('flip');
    playFlip();
    s.flipped.push(card);
    if(s.flipped.length===2){ s.locked=true; checkMatch(team); }
}

function checkMatch(team){
    const s = state[team];
    const [c1,c2] = s.flipped;
    if(c1.dataset.key === c2.dataset.key){
        s.matched++;
        c1.classList.add('matched','bump');
        c2.classList.add('matched','bump');
        s.flipped=[]; s.locked=false;
        updateProgress();
        playMatch();
        if(s.matched===CFG.pick){ setTimeout(()=>declareWinner(team), 450); }
    } else {
        playWrong();
        setTimeout(()=>{
            c1.classList.remove('flip'); c2.classList.remove('flip');
            s.flipped=[]; s.locked=false;
        }, CFG.wrongDelay);
    }
}

function updateProgress(){
    document.getElementById('progress-a').innerText = state.A.matched+'/'+CFG.pick;
    document.getElementById('progress-b').innerText = state.B.matched+'/'+CFG.pick;
}

function declareWinner(team){
    state.A.locked=true; state.B.locked=true;
    const isA = team==='A';
    const c = isA ? '#ef4444' : '#3b82f6';
    const t = document.getElementById('mTitle');
    t.innerText='CHIẾN THẮNG!'; t.style.color=c;
    document.getElementById('mWho').innerText = 'Đội '+(isA?'A':'B')+' về đích trước!';
    document.getElementById('box').style.borderColor=c;
    document.getElementById('modal').classList.add('show');
    playWin();
    confetti();
}

function confetti(){
    const colors=['#f87171','#60a5fa','#fbbf24','#34d399','#c084fc','#fb923c'];
    for(let i=0;i<120;i++){
        const d=document.createElement('div');
        d.className='confetti';
        d.style.left=(Math.random()*100)+'vw';
        d.style.background=colors[(Math.random()*colors.length)|0];
        const s=(Math.random()*8+6); d.style.width=s+'px'; d.style.height=s+'px';
        if(Math.random()<.5) d.style.borderRadius='50%';
        d.style.animationDuration=(Math.random()*1.5+1.5)+'s';
        d.style.animationDelay=(Math.random()*1.5)+'s';
        document.body.appendChild(d);
        setTimeout(()=>d.remove(),3600);
    }
}

function resetGame(){ initGame(); }

/* ===== Âm thanh Web Audio (tự chứa) ===== */
let audioOn=true, actx=null;
function ac(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return actx; }
function tone(freq,dur,type,gain,when){
    if(!audioOn) return; const c=ac(); if(!c) return;
    const t=c.currentTime+(when||0);
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,t);
    g.gain.linearRampToValueAtTime(gain||.14,t+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.03);
}
function playFlip(){ tone(520,.08,'triangle',.10); }
function playMatch(){ tone(660,.12,'sine',.16,0); tone(880,.14,'sine',.16,.08); tone(1180,.2,'sine',.13,.17); }
function playWrong(){ tone(200,.18,'sawtooth',.10); }
function playWin(){ [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.3,'triangle',.16,i*.12)); }
function toggleSound(){
    audioOn=!audioOn;
    document.getElementById('soundBtn').innerText=(audioOn?'🔊':'🔇')+' Âm thanh';
    if(audioOn) tone(880,.12,'sine',.14);
}

window.onload=initGame;
</script>
</body>
</html>
