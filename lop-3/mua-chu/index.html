<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mưa Chữ - Lớp 3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    overflow:hidden;color:#2b3a55;user-select:none;
    background:linear-gradient(#8ed6ff 0%,#bfe9ff 45%,#e7f7ff 100%)}
  #app{height:100dvh;display:flex;flex-direction:column}

  header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px}
  .back{color:#2b3a55;text-decoration:none;font-size:14px;font-weight:700;
    background:rgba(255,255,255,.7);padding:8px 14px;border-radius:20px;box-shadow:0 2px 6px rgba(0,0,0,.08);white-space:nowrap}
  .title{font-size:clamp(20px,5vw,30px);font-weight:900;letter-spacing:.5px;
    color:#fff;text-shadow:0 2px 0 #4aa8e0,0 4px 8px rgba(0,0,0,.15)}
  .snd{border:none;background:rgba(255,255,255,.7);width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08)}

  .hud{display:flex;align-items:center;gap:10px;padding:0 14px 6px;flex-wrap:wrap}
  .stat{background:rgba(255,255,255,.8);border-radius:16px;padding:5px 12px;font-weight:800;font-size:15px;
    display:flex;align-items:center;gap:6px;box-shadow:0 2px 5px rgba(0,0,0,.06)}
  .stat.score{color:#f39c12}.stat.level{color:#8e44ad}
  #comboBox{color:#e84393;transition:transform .15s}
  #comboBox.pump{transform:scale(1.35)}
  .hearts{display:flex;gap:3px;margin-left:auto}

  #field{position:relative;flex:1;overflow:hidden;margin:0 8px;border-radius:18px 18px 0 0;
    background:linear-gradient(#a9deff 0%,#d6f2ff 70%);box-shadow:inset 0 3px 10px rgba(255,255,255,.5)}
  #ground{position:absolute;left:0;right:0;bottom:0;height:54px;
    background:linear-gradient(#b6e86a,#86c93f);border-top:5px solid #7bbf37}
  #ground::before{content:"";position:absolute;top:-14px;left:0;right:0;height:14px;
    background:radial-gradient(circle at 12px 14px,#86c93f 10px,transparent 11px) repeat-x;background-size:24px 14px}
  .cloud{position:absolute;background:#fff;border-radius:50%;opacity:.85;filter:blur(1px);pointer-events:none}

  .fall{position:absolute;left:0;top:0;will-change:transform;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    background:#fff;border-radius:16px;padding:8px 10px 7px;box-shadow:0 6px 14px rgba(40,80,120,.22);
    border:3px solid #fff}
  .fall .pic{width:46px;height:46px}
  .fall .pic svg{width:100%;height:100%;display:block}
  .fall .wtiles{display:flex;gap:2px}
  .fall .tile{min-width:15px;height:22px;padding:0 2px;border-radius:5px;background:#eef3fa;
    color:#7d8aa0;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
  .fall .tile.sp{background:transparent;min-width:7px}
  .fall .tile.lit{background:#8ee38a;color:#1f6b22}
  .fall.active{border-color:#ffd257;box-shadow:0 8px 20px rgba(255,180,40,.5);transform-origin:center}
  .fall.active::after{content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%);
    border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:10px solid #ffd257}
  .fall.pop{animation:pop .38s ease forwards}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(.2);opacity:0}}
  .fall.shake{animation:shk .3s}
  @keyframes shk{0%,100%{margin-left:0}25%{margin-left:-6px}75%{margin-left:6px}}
  .fall.drop{animation:drp .5s ease-in forwards}
  @keyframes drp{to{transform:translateY(60px) rotate(12deg);opacity:0}}

  .spark{position:absolute;width:9px;height:9px;border-radius:50%;pointer-events:none;will-change:transform,opacity}

  #targetPanel{min-height:66px;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 12px;margin:0 8px;
    background:rgba(255,255,255,.55)}
  #targetPanel .tpic{width:40px;height:40px;flex:0 0 auto}
  #targetPanel .tpic svg{width:100%;height:100%}
  #targetPanel .ttiles{display:flex;gap:4px}
  #targetPanel .tile{min-width:30px;height:44px;padding:0 5px;border-radius:9px;background:#fff;
    color:#8794a8;font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 6px rgba(0,0,0,.1)}
  #targetPanel .tile.sp{background:transparent;box-shadow:none;min-width:12px}
  #targetPanel .tile.lit{background:#7bd97a;color:#125214}
  #targetPanel .hint{color:#5b6b86;font-weight:700;font-size:16px}

  #kbd{padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:#dfeaf5}
  .krow{display:flex;justify-content:center;gap:5px;margin:0 auto 5px;max-width:600px}
  .key{flex:1 1 0;min-width:0;height:44px;border-radius:9px;background:#fff;color:#3a4a66;
    font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 2px 0 #b9c8db;transition:transform .06s,background .1s}
  .key.space{flex:3 1 0}
  .key.press{transform:translateY(2px);box-shadow:0 0 0 #b9c8db;background:#e9f0f8}
  .key.glow{background:#ffe27a;color:#7a5a00;box-shadow:0 0 0 3px #ffcb3d,0 2px 0 #d6a41f;animation:gl 1s ease-in-out infinite}
  @keyframes gl{0%,100%{box-shadow:0 0 0 3px #ffcb3d,0 2px 0 #d6a41f}50%{box-shadow:0 0 0 6px #ffe27a,0 2px 0 #d6a41f}}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
    background:linear-gradient(#8ed6ff,#bfe9ff)}
  .overlay[hidden]{display:none}
  .panel{background:#fff;border-radius:26px;padding:26px 24px;max-width:420px;width:100%;text-align:center;
    box-shadow:0 18px 40px rgba(0,0,0,.2)}
  .panel h1{font-size:30px;color:#3aa0e6;margin-bottom:4px}
  .panel .big{font-size:44px;font-weight:900;margin:6px 0}
  .panel p{color:#5b6b86;font-size:15px;line-height:1.55;margin:8px 0}
  .btn{margin-top:14px;border:none;cursor:pointer;font-family:inherit;font-weight:900;font-size:20px;color:#fff;
    background:linear-gradient(#ffb347,#ff8c1a);padding:14px 34px;border-radius:40px;box-shadow:0 6px 0 #e07711;transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #e07711}
  .rain-art{display:flex;justify-content:center;margin-bottom:6px}

  #flash{position:fixed;inset:0;background:#ff5a5a;opacity:0;pointer-events:none;z-index:40;transition:opacity .12s}
  #levelToast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(.6);
    background:#8e44ad;color:#fff;font-weight:900;font-size:30px;padding:14px 30px;border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;z-index:45}
  #levelToast.show{animation:toast 1.3s ease forwards}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
    70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(.9)}}
  @media(max-height:620px){.fall .pic{width:38px;height:38px}#ground{height:44px}.key,.krow .key{height:40px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="back" href="../index.html">&larr; Lớp 3</a>
    <div class="title">Mưa Chữ</div>
    <button class="snd" id="sndBtn" aria-label="Âm thanh"></button>
  </header>
  <div class="hud">
    <div class="stat score">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 2l2.9 6.1 6.6.7-4.9 4.5 1.4 6.5L12 17l-5.9 2.8 1.4-6.5L2.6 8.8l6.6-.7z" fill="#ffd257" stroke="#f0a500" stroke-width="1.2"/></svg>
      <span id="score">0</span>
    </div>
    <div class="stat level">Cấp <span id="level">1</span></div>
    <div class="stat" id="comboBox" style="color:#e84393">x1</div>
    <div class="hearts" id="hearts"></div>
  </div>
  <div id="field"><div id="ground"></div></div>
  <div id="targetPanel"><span class="hint">Chờ chữ rơi xuống...</span></div>
  <div id="kbd"></div>
</div>

<div id="flash"></div>
<div id="levelToast"></div>

<div class="overlay" id="startScreen">
  <div class="panel">
    <div class="rain-art">
      <svg width="150" height="110" viewBox="0 0 150 110">
        <g fill="#eaf4ff"><circle cx="55" cy="34" r="20"/><circle cx="82" cy="28" r="26"/><circle cx="104" cy="38" r="18"/><rect x="45" y="34" width="66" height="26" rx="13"/></g>
        <g font-family="-apple-system,Segoe UI,Roboto" font-weight="900" font-size="20">
          <text x="46" y="82" fill="#4fc3f7">m</text>
          <text x="70" y="94" fill="#ec407a">e</text>
          <text x="96" y="80" fill="#66bb6a">o</text>
        </g>
      </svg>
    </div>
    <h1>Mưa Chữ</h1>
    <p>Các chữ rơi từ trên trời xuống. Em hãy <b>gõ đúng chữ</b> để hứng lấy trước khi nó chạm đất!</p>
    <p>Có bàn phím ở dưới, <b>phím cần bấm sẽ sáng lên</b> để giúp em tìm phím.</p>
    <button class="btn" id="startBtn">Bắt đầu</button>
  </div>
</div>

<div class="overlay" id="overScreen" hidden>
  <div class="panel">
    <h1>Hết giờ chơi rồi!</h1>
    <div class="big" id="finalScore" style="color:#f39c12">0</div>
    <p id="overMsg">Em đã hứng được nhiều chữ lắm!</p>
    <p style="color:#8e44ad;font-weight:800">Kỷ lục: <span id="bestScore">0</span></p>
    <button class="btn" id="againBtn">Chơi lại</button>
  </div>
</div>

<script>
/* ===== Bộ chữ (danh từ + hình vẽ SVG) ===== */
var ICON = {
  meo:'<circle cx="32" cy="37" r="16" fill="#f4a742"/><polygon points="17,22 25,35 13,33" fill="#f4a742"/><polygon points="47,22 39,35 51,33" fill="#f4a742"/><circle cx="26" cy="35" r="3" fill="#3a2a1a"/><circle cx="38" cy="35" r="3" fill="#3a2a1a"/><path d="M32 40 l-3 3 h6 z" fill="#e57373"/><g stroke="#3a2a1a" stroke-width="1.5"><path d="M20 39 h-8"/><path d="M20 43 h-7"/><path d="M44 39 h8"/><path d="M44 43 h7"/></g>',
  ca:'<ellipse cx="29" cy="34" rx="16" ry="11" fill="#4fc3f7"/><polygon points="43,34 56,24 56,44" fill="#29b6f6"/><circle cx="23" cy="31" r="2.6" fill="#0d3b52"/><path d="M18 39 q6 4 12 0" stroke="#0d3b52" stroke-width="1.6" fill="none"/>',
  ga:'<ellipse cx="29" cy="41" rx="15" ry="12" fill="#ffd54f"/><circle cx="41" cy="27" r="9" fill="#ffd54f"/><path d="M38 19 q3 -6 6 0 q3 -5 5 1" fill="#ef5350"/><polygon points="49,27 58,29 49,32" fill="#ff9800"/><circle cx="43" cy="26" r="2" fill="#3a2a1a"/><path d="M18 45 q-6 2 -8 8" stroke="#f9a825" stroke-width="3" fill="none" stroke-linecap="round"/>',
  cho:'<circle cx="32" cy="34" r="15" fill="#c9915f"/><ellipse cx="18" cy="34" rx="6" ry="12" fill="#8d5a2b"/><ellipse cx="46" cy="34" rx="6" ry="12" fill="#8d5a2b"/><circle cx="26" cy="32" r="2.6" fill="#3a2a1a"/><circle cx="38" cy="32" r="2.6" fill="#3a2a1a"/><ellipse cx="32" cy="40" rx="4" ry="3" fill="#3a2a1a"/>',
  voi:'<ellipse cx="31" cy="35" rx="15" ry="13" fill="#90a4ae"/><circle cx="17" cy="30" r="8" fill="#78909c"/><path d="M43 39 q11 1 8 13 q-1 4 -5 2" stroke="#90a4ae" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="30" cy="31" r="2.6" fill="#37474f"/><path d="M28 48 l3 5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>',
  tao:'<path d="M32 21 C22 15 12 23 16 35 C18 45 26 50 32 50 C38 50 46 45 48 35 C52 23 42 15 32 21 Z" fill="#e53935"/><path d="M32 21 q1 -6 7 -8" stroke="#5d4037" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M34 15 q6 -3 10 1 q-4 5 -10 2 z" fill="#66bb6a"/>',
  hoa:'<g fill="#ec407a"><circle cx="32" cy="18" r="8"/><circle cx="45" cy="29" r="8"/><circle cx="40" cy="44" r="8"/><circle cx="24" cy="44" r="8"/><circle cx="19" cy="29" r="8"/></g><circle cx="32" cy="32" r="8" fill="#ffca28"/>',
  sao:'<polygon points="32,10 39,26 56,26 42,37 47,54 32,44 17,54 22,37 8,26 25,26" fill="#ffca28" stroke="#f9a825" stroke-width="2"/>',
  nha:'<polygon points="32,12 54,32 10,32" fill="#ef5350"/><rect x="16" y="32" width="32" height="22" fill="#ffca28"/><rect x="28" y="40" width="10" height="14" fill="#8d5a2b"/>',
  cay:'<rect x="28" y="38" width="8" height="16" fill="#8d5a2b"/><circle cx="32" cy="26" r="15" fill="#66bb6a"/><circle cx="21" cy="33" r="9" fill="#66bb6a"/><circle cx="43" cy="33" r="9" fill="#66bb6a"/>',
  may:'<g fill="#f4fbff"><circle cx="24" cy="34" r="10"/><circle cx="38" cy="31" r="12"/><circle cx="46" cy="38" r="9"/><rect x="20" y="34" width="30" height="12" rx="6"/></g>',
  mua:'<g fill="#cfd8dc"><circle cx="26" cy="25" r="9"/><circle cx="38" cy="23" r="11"/><rect x="20" y="23" width="26" height="10" rx="5"/></g><g fill="#4fc3f7"><path d="M22 39 l-3 6 a3 3 0 0 0 6 0 z"/><path d="M32 41 l-3 6 a3 3 0 0 0 6 0 z"/><path d="M42 39 l-3 6 a3 3 0 0 0 6 0 z"/></g>',
  tim:'<path d="M32 50 C10 34 14 16 26 16 C31 16 32 20 32 22 C32 20 33 16 38 16 C50 16 54 34 32 50 Z" fill="#ec407a"/>',
  kem:'<polygon points="24,34 40,34 32,56" fill="#d7a86e"/><circle cx="27" cy="28" r="8" fill="#f48fb1"/><circle cx="37" cy="28" r="8" fill="#4fc3f7"/><circle cx="32" cy="22" r="8" fill="#fff59d"/><circle cx="32" cy="16" r="3" fill="#e53935"/>',
  du:'<path d="M10 33 a22 12 0 0 1 44 0 z" fill="#ef5350"/><path d="M21 33 q11 -7 22 0" stroke="#fff" stroke-width="1.6" fill="none"/><path d="M32 21 v27 a4 4 0 0 1 -8 0" stroke="#5d4037" stroke-width="3" fill="none"/>',
  bong:'<circle cx="32" cy="34" r="18" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/><polygon points="32,25 39,30 37,39 27,39 25,30" fill="#37474f"/><path d="M32 16 l0 9 M50 30 l-11 0 M45 47 l-8 -8 M19 47 l8 -8 M14 30 l11 0" stroke="#546e7a" stroke-width="1.6"/>',
  banh:'<rect x="16" y="34" width="32" height="18" rx="3" fill="#f48fb1"/><rect x="16" y="30" width="32" height="8" rx="3" fill="#f06292"/><rect x="30" y="16" width="4" height="10" fill="#fbc02d"/><circle cx="32" cy="14" r="3" fill="#ff7043"/><g fill="#fff"><circle cx="24" cy="43" r="2"/><circle cx="32" cy="47" r="2"/><circle cx="40" cy="43" r="2"/></g>',
  trang:'<path d="M40 12 A22 22 0 1 0 40 56 A17 17 0 1 1 40 12 Z" fill="#ffd54f"/><circle cx="26" cy="24" r="3" fill="#f4c430"/><circle cx="22" cy="38" r="2.4" fill="#f4c430"/>',
  thuyen:'<path d="M12 40 h40 l-6 12 h-28 z" fill="#ef5350"/><rect x="31" y="14" width="3" height="26" fill="#5d4037"/><polygon points="34,16 34,38 52,38" fill="#fff59d" stroke="#fbc02d" stroke-width="1.5"/><polygon points="31,18 31,38 16,38" fill="#4fc3f7"/>',
  oto:'<rect x="9" y="34" width="46" height="14" rx="5" fill="#42a5f5"/><path d="M18 34 l6 -10 h16 l6 10 z" fill="#64b5f6"/><rect x="26" y="26" width="12" height="8" fill="#bbdefb"/><circle cx="22" cy="50" r="5" fill="#37474f"/><circle cx="42" cy="50" r="5" fill="#37474f"/>'
};
var WORDS = [
  {d:"mèo",k:"meo"},{d:"cá",k:"ca"},{d:"gà",k:"ga"},{d:"chó",k:"cho"},{d:"voi",k:"voi"},
  {d:"táo",k:"tao"},{d:"hoa",k:"hoa"},{d:"sao",k:"sao"},{d:"nhà",k:"nha"},{d:"cây",k:"cay"},
  {d:"mây",k:"may"},{d:"mưa",k:"mua"},{d:"tim",k:"tim"},{d:"kem",k:"kem"},{d:"dù",k:"du"},
  {d:"bóng",k:"bong"},{d:"bánh",k:"banh"},{d:"ô tô",k:"oto"},{d:"trăng",k:"trang"},{d:"thuyền",k:"thuyen"}
];
function toAscii(s){
  return s.normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[ưƯ]/g,function(c){return c==='ư'?'u':'U';})
    .replace(/[ơƠ]/g,function(c){return c==='ơ'?'o':'O';})
    .replace(/[đĐ]/g,function(c){return c==='đ'?'d':'D';});
}
WORDS.forEach(function(w){w.ascii=toAscii(w.d).toLowerCase();w.len=w.ascii.replace(/ /g,'').length;});

/* ===== Trạng thái ===== */
var $=function(id){return document.getElementById(id);};
var state='start', score=0, level=1, hearts=3, combo=1, caught=0;
var best=+(localStorage.getItem('muachu_best_3')||0);
var items=[], idc=0, activeItem=null;
var fallSpeed=40, spawnGap=3, maxItems=1, maxLen=3;
var lastT=0, spawnAcc=0, rafId=0;
var fieldW=0, fieldH=0, groundH=54, lastGlow='';
var soundOn=true, lastPick=-1;

/* ===== Âm thanh ===== */
var AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function beep(f,d,type,vol,slide){
  if(!soundOn)return; var c=ac(); if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.02);
}
function sCorrect(){beep(660,0.09,'sine',0.14,880);}
function sWrong(){beep(180,0.14,'sawtooth',0.09);}
function sCatch(){beep(523,0.09,'triangle',0.16);setTimeout(function(){beep(784,0.14,'triangle',0.16);},80);}
function sMiss(){beep(300,0.28,'sine',0.16,120);}
function sLevel(){beep(523,0.1,'triangle',0.15);setTimeout(function(){beep(784,0.1,'triangle',0.15);},90);setTimeout(function(){beep(1046,0.18,'triangle',0.15);},180);}
var viVoice=null;
function loadVoice(){ try{var vs=speechSynthesis.getVoices();viVoice=vs.find(function(v){return /vi(-|_)?/i.test(v.lang);})||null;}catch(e){} }
if('speechSynthesis' in window){ loadVoice(); speechSynthesis.onvoiceschanged=loadVoice; }
function speak(t){
  if(!soundOn||!('speechSynthesis' in window))return;
  try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang='vi-VN'; u.rate=1.02; if(viVoice)u.voice=viVoice; speechSynthesis.speak(u); }catch(e){}
}

/* ===== Bàn phím ảo ===== */
var ROWS=['qwertyuiop','asdfghjkl','zxcvbnm'];
function buildKbd(){
  var kb=$('kbd'); kb.innerHTML='';
  ROWS.forEach(function(r){
    var row=document.createElement('div'); row.className='krow';
    r.split('').forEach(function(ch){
      var k=document.createElement('div'); k.className='key'; k.textContent=ch; k.dataset.k=ch;
      row.appendChild(k);
    });
    kb.appendChild(row);
  });
  var sr=document.createElement('div'); sr.className='krow';
  var sp=document.createElement('div'); sp.className='key space'; sp.textContent='cách'; sp.dataset.k=' ';
  sr.appendChild(sp); kb.appendChild(sr);
  kb.querySelectorAll('.key').forEach(function(k){
    k.addEventListener('pointerdown',function(e){ e.preventDefault(); handleType(k.dataset.k); pressKey(k.dataset.k); });
  });
}
function keyEl(ch){ return document.querySelector('.key[data-k="'+(ch===' '?' ':ch)+'"]'); }
function pressKey(ch){ var k=keyEl(ch); if(!k)return; k.classList.add('press'); setTimeout(function(){k.classList.remove('press');},110); }
function updateGlow(){
  var g = activeItem ? nextExpected(activeItem) : null;
  if(g===lastGlow) return; lastGlow=g;
  document.querySelectorAll('.key.glow').forEach(function(k){k.classList.remove('glow');});
  if(g){ var k=keyEl(g); if(k)k.classList.add('glow'); }
}

/* ===== Chữ rơi ===== */
function measureField(){ var f=$('field'); fieldW=f.clientWidth; fieldH=f.clientHeight; }
function pickWord(){
  var pool=[]; for(var i=0;i<WORDS.length;i++){ if(WORDS[i].len<=maxLen && i!==lastPick) pool.push(i); }
  if(!pool.length){ for(var j=0;j<WORDS.length;j++) if(WORDS[j].len<=maxLen) pool.push(j); }
  var idx=pool[Math.floor(Math.random()*pool.length)]; lastPick=idx; return WORDS[idx];
}
function tilesHtml(w){
  var h=''; for(var i=0;i<w.d.length;i++){ var c=w.d[i]; if(c===' ')h+='<span class="tile sp"></span>'; else h+='<span class="tile">'+c+'</span>'; }
  return h;
}
function spawnItem(){
  if(items.length>=maxItems) return;
  var w=pickWord();
  var el=document.createElement('div'); el.className='fall';
  el.innerHTML='<div class="pic"><svg viewBox="0 0 64 64">'+ICON[w.k]+'</svg></div><div class="wtiles">'+tilesHtml(w)+'</div>';
  $('field').appendChild(el);
  var cw=el.offsetWidth, ch=el.offsetHeight;
  var x=Math.random()*Math.max(4,(fieldW-cw-8))+4;
  var it={id:++idc,w:w,el:el,x:x,y:-ch-4,h:ch,ti:0,caught:false,tiles:el.querySelectorAll('.tile')};
  el.style.transform='translate('+x+'px,'+it.y+'px)';
  items.push(it);
}
function nextExpected(it){
  var a=it.w.ascii; while(it.ti<a.length && a[it.ti]===' ') it.ti++;
  return it.ti<a.length ? a[it.ti] : null;
}
function fillProgress(it){
  for(var i=0;i<it.tiles.length;i++){ it.tiles[i].classList.toggle('lit', i<it.ti); }
  if(it===activeItem) renderTargetFill(it);
}
function renderTarget(it){
  var tp=$('targetPanel');
  if(!it){ tp.innerHTML='<span class="hint">Chờ chữ rơi xuống...</span>'; return; }
  tp.innerHTML='<span class="tpic"><svg viewBox="0 0 64 64">'+ICON[it.w.k]+'</svg></span><div class="ttiles">'+tilesHtml(it.w)+'</div>';
  renderTargetFill(it);
}
function renderTargetFill(it){
  var t=$('targetPanel').querySelectorAll('.tile');
  for(var i=0;i<t.length;i++){ t[i].classList.toggle('lit', i<it.ti); }
}
function updateActive(){
  var b=null;
  for(var i=0;i<items.length;i++){ var it=items[i]; if(it.caught)continue; if(!b||it.y>b.y)b=it; }
  if(b!==activeItem){
    if(activeItem&&activeItem.el)activeItem.el.classList.remove('active');
    activeItem=b;
    if(activeItem)activeItem.el.classList.add('active');
    renderTarget(activeItem);
  }
  updateGlow();
}
function removeItem(it){
  var k=items.indexOf(it); if(k>=0)items.splice(k,1);
  if(it.el&&it.el.parentNode)it.el.parentNode.removeChild(it.el);
  if(it===activeItem){ activeItem=null; }
}

/* ===== Xử lý gõ ===== */
function handleType(ch){
  if(state!=='play')return;
  ch=(ch||'').toLowerCase();
  var it=activeItem; if(!it||it.caught){ sWrong(); return; }
  var exp=nextExpected(it);
  if(exp==null)return;
  if(ch===exp){
    it.ti++;
    var done=(nextExpected(it)==null);
    fillProgress(it); sCorrect();
    if(done) catchItem(it); else updateGlow();
  } else {
    sWrong();
    it.el.classList.remove('shake'); void it.el.offsetWidth; it.el.classList.add('shake');
  }
}
function catchItem(it){
  it.caught=true;
  score+=10*combo; combo=Math.min(combo+1,5); caught++;
  $('score').textContent=score;
  var cb=$('comboBox'); cb.textContent='x'+combo; cb.classList.add('pump'); setTimeout(function(){cb.classList.remove('pump');},160);
  sCatch(); speak(it.w.d); burst(it);
  it.el.classList.add('pop');
  if(it===activeItem){ activeItem=null; renderTarget(null); }
  var el=it.el;
  setTimeout(function(){ if(el&&el.parentNode)el.parentNode.removeChild(el); },380);
  var k=items.indexOf(it); if(k>=0)items.splice(k,1);
  var nl=1+Math.floor(caught/6);
  if(nl>level){ level=nl; setLevelParams(); levelUp(); }
}
function missItem(it){
  if(it.caught)return; it.caught=true;
  hearts--; combo=1; $('comboBox').textContent='x1';
  renderHearts(); sMiss(); flashRed();
  it.el.classList.add('drop');
  if(it===activeItem){ activeItem=null; renderTarget(null); }
  var el=it.el; setTimeout(function(){ if(el&&el.parentNode)el.parentNode.removeChild(el); },500);
  var k=items.indexOf(it); if(k>=0)items.splice(k,1);
  if(hearts<=0) gameOver();
}

/* ===== Hiệu ứng ===== */
function burst(it){
  var f=$('field'), cx=it.x+it.h/1.2, cy=it.y+it.h/2;
  var cols=['#ffd257','#ec407a','#4fc3f7','#66bb6a','#ff8a65'];
  for(var i=0;i<12;i++){
    var s=document.createElement('div'); s.className='spark';
    s.style.background=cols[i%cols.length]; s.style.left=cx+'px'; s.style.top=cy+'px';
    f.appendChild(s);
    var ang=Math.random()*6.28, dist=30+Math.random()*40;
    var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-20;
    (function(sp,dx,dy){
      sp.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px)',opacity:0}],{duration:520,easing:'ease-out'});
      setTimeout(function(){ if(sp.parentNode)sp.parentNode.removeChild(sp); },520);
    })(s,dx,dy);
  }
}
function flashRed(){ var f=$('flash'); f.style.opacity='.4'; setTimeout(function(){f.style.opacity='0';},120); }
function levelUp(){ sLevel(); $('level').textContent=level; var t=$('levelToast'); t.textContent='Cấp '+level; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); }
function renderHearts(){
  var h=$('hearts'), s='';
  for(var i=0;i<3;i++){ var on=i<hearts;
    s+='<svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 21C6 16 3 12 3 8.5 3 6 5 4 7.5 4 9.4 4 11 5.2 12 7c1-1.8 2.6-3 4.5-3C19 4 21 6 21 8.5 21 12 18 16 12 21z" fill="'+(on?'#ff5a7a':'#d7dfe8')+'" stroke="'+(on?'#e63e63':'#c2ccd8')+'" stroke-width="1.2"/></svg>';
  }
  h.innerHTML=s;
}

/* ===== Cấp độ & vòng lặp ===== */
function setLevelParams(){
  fallSpeed=38+(level-1)*10;
  spawnGap=Math.max(1.5,3.4-(level-1)*0.28);
  maxItems=Math.min(1+Math.floor((level-1)/2),3);
  maxLen=level<=1?3:(level<=2?4:(level<=3?5:20));
}
function frame(t){
  if(state!=='play')return;
  if(!lastT)lastT=t;
  var dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
  spawnAcc+=dt;
  if(spawnAcc>=spawnGap){ spawnAcc=0; spawnItem(); }
  var limit=fieldH-groundH+8;
  for(var i=0;i<items.length;i++){
    var it=items[i]; if(it.caught)continue;
    it.y+=fallSpeed*dt; it.el.style.transform='translate('+it.x+'px,'+it.y+'px)';
  }
  for(var j=items.length-1;j>=0;j--){ var m=items[j]; if(!m.caught && m.y+m.h>=limit) missItem(m); }
  updateActive();
  rafId=requestAnimationFrame(frame);
}

/* ===== Bắt đầu / Kết thúc ===== */
function startGame(){
  ac();
  items.slice().forEach(function(it){ if(it.el&&it.el.parentNode)it.el.parentNode.removeChild(it.el); });
  items=[]; activeItem=null; lastGlow='';
  score=0; level=1; hearts=3; combo=1; caught=0; lastPick=-1;
  $('score').textContent='0'; $('level').textContent='1'; $('comboBox').textContent='x1';
  renderHearts(); renderTarget(null);
  document.querySelectorAll('.key.glow').forEach(function(k){k.classList.remove('glow');});
  $('startScreen').hidden=true; $('overScreen').hidden=true;
  measureField();
  setLevelParams();
  state='play'; lastT=0; spawnAcc=spawnGap-0.4;
  cancelAnimationFrame(rafId); rafId=requestAnimationFrame(frame);
}
function gameOver(){
  state='over'; cancelAnimationFrame(rafId);
  if(score>best){ best=score; try{localStorage.setItem('muachu_best_3',best);}catch(e){} }
  $('finalScore').textContent=score; $('bestScore').textContent=best;
  var msg = score>=120?'Tuyệt vời! Em gõ chữ giỏi lắm!':(score>=60?'Giỏi lắm! Em hứng được nhiều chữ!':'Cố lên nào, em chơi lại nhé!');
  $('overMsg').textContent=msg;
  $('overScreen').hidden=false;
  speak('Em được '+score+' điểm');
}

/* ===== Sự kiện ===== */
document.addEventListener('keydown',function(e){
  if(state!=='play')return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key;
  if(k===' '||k==='Spacebar'){ e.preventDefault(); handleType(' '); pressKey(' '); return; }
  if(k&&k.length===1 && /[a-zA-Z]/.test(k)){ e.preventDefault(); handleType(k.toLowerCase()); pressKey(k.toLowerCase()); }
});
window.addEventListener('resize',function(){ measureField(); });
function setSndIcon(){
  $('sndBtn').innerHTML = soundOn
    ? '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="#2b3a55"/><path d="M16 8c1.5 1 1.5 7 0 8M18.5 6c3 2 3 10 0 12" stroke="#2b3a55" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>'
    : '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="#2b3a55"/><path d="M16 9l6 6M22 9l-6 6" stroke="#e05353" stroke-width="1.8" stroke-linecap="round"/></svg>';
}
$('sndBtn').addEventListener('click',function(){ soundOn=!soundOn; if(!soundOn&&'speechSynthesis' in window)speechSynthesis.cancel(); setSndIcon(); });
$('startBtn').addEventListener('click',startGame);
$('againBtn').addEventListener('click',startGame);

buildKbd(); renderHearts(); setSndIcon(); measureField();
</script>
</body>
