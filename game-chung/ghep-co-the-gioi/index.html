<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ghép Cờ Các Nước</title>
<style>
  :root{--ink:#2b3a55;--a:#2563eb;--b:#16a34a;--line:#93c5fd}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  body{font-family:'Nunito','Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(160deg,#eff6ff,#f0fdf4 55%,#fefce8);color:var(--ink);min-height:100vh;
    user-select:none;-webkit-user-select:none;padding:12px;overflow-x:hidden}
  #app{max-width:1140px;margin:0 auto}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .btn{border:none;cursor:pointer;font:inherit;font-weight:800;font-size:1rem;border-radius:16px;padding:10px 18px;background:#fff;color:var(--ink);
    box-shadow:0 3px 0 rgba(43,58,85,.16),0 6px 14px rgba(43,58,85,.08);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.1}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(43,58,85,.16)}
  .btn.a{background:var(--a);color:#fff}
  .btn.b{background:var(--b);color:#fff}
  .btn svg{width:22px;height:22px;flex:none}
  #sound{margin-left:auto;width:48px;height:48px;padding:0}
  h1{font-size:clamp(1.7rem,5vw,2.6rem);text-align:center;margin:2px 0 4px;font-weight:900;line-height:1.15;
    background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .lead{text-align:center;color:#475569;font-weight:700;margin-bottom:14px}
  .grades{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
  .grades>span{font-weight:800;color:#475569}
  .grades .btn.on{background:linear-gradient(180deg,var(--a),var(--b));color:#fff}
  .lvinfo{text-align:center;font-weight:700;color:#64748b;margin-bottom:16px;font-size:.95rem}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;padding-bottom:20px}
  .gi{border:none;cursor:pointer;background:#fff;border-radius:22px;padding:12px 10px 10px;font:inherit;color:var(--ink);
    box-shadow:0 4px 0 rgba(43,58,85,.12),0 8px 18px rgba(43,58,85,.08);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
  .gi:hover{transform:translateY(-3px)}
  .gth{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
  .gth svg{max-width:100%;max-height:100%;display:block}
  .gi.flag .gth svg{filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
  .gname{font-weight:900;font-size:1.05rem;text-align:center}
  .stars{display:flex;gap:2px;justify-content:center}
  .stars svg{width:20px;height:20px}

  .hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .hud .name{font-weight:900;font-size:clamp(1.1rem,3vw,1.45rem);margin-right:auto;color:var(--a)}
  .chip{background:#fff;border-radius:14px;padding:8px 12px;font-weight:800;box-shadow:0 3px 0 rgba(43,58,85,.1);font-size:.95rem;white-space:nowrap}
  .chip b{color:var(--b);font-size:1.12rem}
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
  #boardWrap{position:relative;display:flex;justify-content:center;align-items:center;background:#fff;border-radius:24px;padding:10px;
    box-shadow:0 4px 0 rgba(43,58,85,.1),0 10px 24px rgba(43,58,85,.08)}
  #board{display:block;border-radius:16px}
  #msg{position:absolute;left:50%;top:14px;transform:translate(-50%,-8px);background:#1e293b;color:#fff;font-weight:800;padding:9px 16px;border-radius:14px;
    opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:5;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
  #msg.on{opacity:.92;transform:translate(-50%,0)}
  .side{display:flex;flex-direction:column;gap:10px}
  .refbox{background:#fff;border-radius:18px;padding:8px 10px;display:flex;gap:10px;align-items:center;box-shadow:0 3px 0 rgba(43,58,85,.1)}
  .refbox .lbl{font-weight:900;color:#64748b;font-size:.9rem;line-height:1.3}
  #ref{width:104px;height:84px;display:flex;align-items:center;justify-content:center;flex:none}
  #ref svg{max-width:100%;max-height:100%;display:block}
  .tools{display:flex;gap:8px}
  .tools .btn{flex:1;padding:10px 8px;font-size:.95rem}
  #tray{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;justify-content:center;background:rgba(255,255,255,.55);border-radius:18px;padding:10px;
    border:3px dashed var(--line);max-height:calc(100vh - 290px);min-height:120px;overflow:auto}
  .pc{min-width:72px;min-height:72px;padding:6px;background:#fff;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:grab;touch-action:none;box-shadow:0 3px 0 #e2e8f0;transition:opacity .15s}
  .pc .pi svg{display:block;filter:drop-shadow(0 0 1px rgba(51,65,85,.55)) drop-shadow(0 2px 2px rgba(0,0,0,.15))}
  .pc .pn{font-size:.72rem;font-weight:800;color:#64748b;margin-top:4px;text-align:center;max-width:104px;line-height:1.15}
  .pc.lifted{opacity:.2}
  .pc.shake{animation:shake .4s}
  .pc.glow{box-shadow:0 0 0 4px #facc15,0 0 18px #facc15;animation:pulse .6s ease-in-out infinite alternate}
  .float{position:fixed;left:0;top:0;z-index:50;pointer-events:none;transform-origin:50% 50%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.28))}
  .float svg{display:block}
  .plus{position:fixed;z-index:55;font-weight:900;font-size:1.6rem;color:#16a34a;pointer-events:none;text-shadow:0 2px 0 #fff;animation:rise .9s ease-out forwards}

  .gl *{fill:none!important;stroke:#64748b!important;stroke-width:2px!important;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
  .gl text{display:none}
  .L4 .gl{opacity:0}
  .gl.flash{opacity:1!important}
  .tray-done{width:100%;text-align:center;font-weight:900;color:#16a34a;padding:16px 6px;font-size:1.1rem}
  .gl.flash *{stroke:#f97316!important;stroke-width:4px!important;animation:dash .5s linear infinite}
  #slots g.pop{animation:pop .35s ease-out;transform-box:fill-box;transform-origin:center}
  #board.dance{animation:bounce .55s ease-in-out 4;transform-origin:50% 100%}
  #board.wave{animation:wave 1s ease-in-out 3;transform-origin:0 50%}

  #win{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
  .wcard{background:#fff;border-radius:28px;padding:22px 22px 18px;max-width:440px;width:100%;text-align:center;animation:pop .4s ease-out;max-height:96vh;overflow:auto}
  .wcard h2{font-size:2.1rem;font-weight:900;color:var(--a);margin:4px 0}
  .wcard .stars svg{width:54px;height:54px}
  #wpic{display:flex;justify-content:center;margin:8px 0}
  #wpic svg{width:200px;max-width:70%;height:auto;max-height:180px}
  .wname{font-weight:900;font-size:1.35rem}
  .wfact{color:#475569;font-weight:700;margin:6px 0 4px}
  .wstat{color:#64748b;font-weight:700;font-size:.92rem;margin-bottom:14px}
  .wbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  #conf i{position:fixed;top:-14px;width:10px;height:14px;border-radius:2px;z-index:70;pointer-events:none;animation:fall linear forwards}

  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  @keyframes pulse{to{transform:scale(1.07)}}
  @keyframes rise{to{transform:translateY(-60px);opacity:0}}
  @keyframes dash{to{stroke-dashoffset:-22}}
  @keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes bounce{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-14px) scale(1.02,.98)}60%{transform:translateY(0) scale(1.03,.96)}}
  @keyframes wave{0%,100%{transform:skewY(0)}25%{transform:skewY(2.5deg) scaleX(.98)}75%{transform:skewY(-2.5deg) scaleX(.98)}}
  @keyframes fall{to{transform:translateY(106vh) rotate(720deg)}}
  @media(max-width:820px){
    .stage{grid-template-columns:1fr}
    #tray{max-height:none}
    .refbox{order:-1}
  }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <a id="back" class="btn" href="../../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>Quay lại</span></a>
    <button id="sound" class="btn" title="Bật/tắt âm thanh"></button>
  </div>

  <section id="home">
    <h1>Ghép Cờ Các Nước</h1>
    <p class="lead">Chọn một lá cờ, rồi kéo từng phần (sọc, ngôi sao, hình tròn...) vào đúng chỗ để ghép lại lá cờ!</p>
    <div class="grades" id="grades"></div>
    <p class="lvinfo" id="lvinfo"></p>
    <div class="gal" id="gal"></div>
  </section>

  <section id="play" hidden>
    <div class="hud">
      <button id="toGal" class="btn"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>Danh sách</span></button>
      <div class="name" id="itemName"></div>
      <div class="chip">Điểm <b id="score">0</b></div>
      <div class="chip">Còn <b id="left">0</b> mảnh</div>
      <div class="chip"><b id="time">0:00</b></div>
    </div>
    <div class="stage">
      <div id="boardWrap"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg><div id="msg"></div></div>
      <aside class="side">
        <div class="refbox"><div id="ref"></div><div class="lbl">Hình mẫu<br><span style="font-weight:700">Kéo từng mảnh vào đúng chỗ trên bảng</span></div></div>
        <div class="tools">
          <button id="hint" class="btn a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" fill="rgba(255,255,255,.35)"/></svg><span id="hintTxt">Gợi ý (3)</span></button>
          <button id="redo" class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg><span>Làm lại</span></button>
        </div>
        <div id="tray"></div>
      </aside>
    </div>
  </section>
</div>

<div id="win" hidden><div class="wcard">
  <div class="stars" id="wstars"></div>
  <h2>Tuyệt vời!</h2>
  <div id="wpic"></div>
  <div class="wname" id="wname"></div>
  <p class="wfact" id="wfact"></p>
  <p class="wstat" id="wstat"></p>
  <div class="wbtns">
    <button id="wAgain" class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg><span>Chơi lại</span></button>
    <button id="wNext" class="btn a"><span>Hình tiếp theo</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <button id="wList" class="btn"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>Danh sách</span></button>
  </div>
</div></div>
<div id="conf"></div>
<svg id="meas" xmlns="http://www.w3.org/2000/svg" width="10" height="10" style="position:absolute;left:-9999px;top:0;visibility:hidden"></svg>

<script>
/* ===== cờ các nước: mỗi phần (sọc, sao, hình tròn...) là một mảnh =====
   g: khối lớp của lá cờ; k: các mảnh giống hệt nhau (đặt chỗ nào cũng được); bb: khung tự khai báo cho phần bị cắt */
const r=(x,y,w,h,f)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;
const ci=(cx,cy,rr,f)=>`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="${f}"/>`;
const pg=(pts,f)=>`<polygon points="${pts}" fill="${f}"/>`;
const pa=(d,f,x='')=>`<path d="${d}" fill="${f}"${x}/>`;
function star(cx,cy,R,f,rot=-90,n=5,q=.382){const p=[];for(let i=0;i<2*n;i++){const rr=i%2?R*q:R,a=(rot+i*180/n)*Math.PI/180;
  p.push((cx+rr*Math.cos(a)).toFixed(2)+','+(cy+rr*Math.sin(a)).toFixed(2))}return pg(p.join(' '),f)}
/* trăng lưỡi liềm: hình tròn (cx,cy,R) trừ hình tròn r lệch sang phải dx; rot để xoay */
function cres(cx,cy,R,dx,rr,f,rot=0){const a=(R*R-rr*rr+dx*dx)/(2*dx),h=Math.sqrt(R*R-a*a),x=(cx+a).toFixed(2),y1=(cy-h).toFixed(2),y2=(cy+h).toFixed(2);
  return `<path d="M${x} ${y1}A${R} ${R} 0 1 0 ${x} ${y2}A${rr} ${rr} 0 1 1 ${x} ${y1}Z" fill="${f}"${rot?` transform="rotate(${rot} ${cx} ${cy})"`:''}/>`}
const clip=(x,y,w,h,vb,inner)=>`<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="${vb}">${inner}</svg>`;
const ln=(d,c,w,x='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}"${x}/>`;
const pt=(id,n,s,o)=>Object.assign({id,n,s},o||{});
const F=(id,name,cap,cont,g,W,H,parts)=>({id,name,cap,cont,g,W,H,parts});

/* quẻ cờ Hàn Quốc: code 3 vạch, 1 = liền, 0 = đứt */
function tri(cx,cy,ang,code){let s='';[-12,0,12].forEach((y,i)=>{s+=code[i]==='1'?`<rect x="-25" y="${y-4}" width="50" height="8"/>`:
  `<rect x="-25" y="${y-4}" width="22" height="8"/><rect x="3" y="${y-4}" width="22" height="8"/>`});
  return `<g transform="translate(${cx} ${cy}) rotate(${ang})" fill="#000">${s}</g>`}
/* hình Anh quốc trong khung 300x150 */
const UJW=ln('M0 0L300 150M300 0L0 150','#fff',30)+r(125,0,50,150,'#fff')+r(0,50,300,50,'#fff');
const UJR=ln('M0 0L300 150M300 0L0 150','#c8102e',10)+r(135,0,30,150,'#c8102e')+r(0,60,300,30,'#c8102e');
const MAPLE=[[0,-62],[11,-41],[25,-48],[19,-16],[40,-36],[36,-23],[57,-27],[49,-6],[56,-2],[27,17],[31,29],[4,25],[4,58],
  [-4,58],[-4,25],[-31,29],[-27,17],[-56,-2],[-49,-6],[-57,-27],[-36,-23],[-40,-36],[-19,-16],[-25,-48],[-11,-41]].map(([x,y])=>(150+x)+','+(100+y)).join(' ');
const CHAKRA=`<g fill="none" stroke="#000080"><circle cx="150" cy="100" r="27" stroke-width="3.2"/>`+
  Array.from({length:24},(_,i)=>{const a=i*15*Math.PI/180;return `<line x1="150" y1="100" x2="${(150+26*Math.cos(a)).toFixed(2)}" y2="${(100+26*Math.sin(a)).toFixed(2)}" stroke-width="1.3"/>`}).join('')+
  `</g><circle cx="150" cy="100" r="5" fill="#000080"/>`;
const H3=200/3,US=160/13,MYS=150/14;
const NPD='M15 15 L235 160 L95 160 L245 315 L15 315 Z';
const usStars=(()=>{let s='';for(let j=0;j<9;j++){const n=j%2?5:6;for(let i=0;i<n;i++)s+=star((j%2?20:10)+20*i,(j+1)*7*US/10,3.6,'#fff')}return s})();

const ITEMS=[
/* ---------- Lớp 1: 2-3 phần ---------- */
F('vn','Việt Nam','Hà Nội','châu Á',1,300,200,[pt('bg','Nền đỏ',r(0,0,300,200,'#da251d')),pt('st','Ngôi sao vàng',star(150,100,60,'#ffde00'))]),
F('jp','Nhật Bản','Tô-ky-ô','châu Á',1,300,200,[pt('bg','Nền trắng',r(0,0,300,200,'#fff')),pt('c','Mặt trời đỏ',ci(150,100,60,'#bc002d'))]),
F('fr','Pháp','Pa-ri','châu Âu',1,300,200,[pt('a','Sọc xanh',r(0,0,100,200,'#0055a4')),pt('b','Sọc trắng',r(100,0,100,200,'#fff')),pt('c','Sọc đỏ',r(200,0,100,200,'#ef4135'))]),
F('it','Ý','Rô-ma','châu Âu',1,300,200,[pt('a','Sọc xanh lá',r(0,0,100,200,'#009246')),pt('b','Sọc trắng',r(100,0,100,200,'#fff')),pt('c','Sọc đỏ',r(200,0,100,200,'#ce2b37'))]),
F('de','Đức','Béc-lin','châu Âu',1,300,200,[pt('a','Sọc đen',r(0,0,300,H3,'#000')),pt('b','Sọc đỏ',r(0,H3,300,H3,'#dd0000')),pt('c','Sọc vàng',r(0,2*H3,300,H3,'#ffce00'))]),
F('ru','Nga','Mát-xcơ-va','châu Âu và châu Á',1,300,200,[pt('a','Sọc trắng',r(0,0,300,H3,'#fff')),pt('b','Sọc xanh',r(0,H3,300,H3,'#0039a6')),pt('c','Sọc đỏ',r(0,2*H3,300,H3,'#d52b1e'))]),
F('ua','Ukraina','Ki-ép','châu Âu',1,300,200,[pt('a','Sọc xanh',r(0,0,300,100,'#0057b7')),pt('b','Sọc vàng',r(0,100,300,100,'#ffd700'))]),
F('bd','Bangladesh','Đắc-ca','châu Á',1,300,200,[pt('bg','Nền xanh lá',r(0,0,300,200,'#006a4e')),pt('c','Hình tròn đỏ',ci(135,100,60,'#f42a41'))]),

/* ---------- Lớp 2: 3-5 phần ---------- */
F('la','Lào','Viêng Chăn','châu Á',2,300,200,[pt('a','Sọc đỏ',r(0,0,300,50,'#ce1126'),{k:'r'}),pt('b','Sọc xanh',r(0,50,300,100,'#002868')),
  pt('c','Sọc đỏ',r(0,150,300,50,'#ce1126'),{k:'r'}),pt('d','Hình tròn trắng',ci(150,100,40,'#fff'))]),
F('th','Thái Lan','Băng Cốc','châu Á',2,300,200,[pt('a','Sọc đỏ',r(0,0,300,H3/2,'#a51931'),{k:'r'}),pt('b','Sọc trắng',r(0,H3/2,300,H3/2,'#fff'),{k:'w'}),
  pt('c','Sọc xanh',r(0,H3,300,H3,'#2d2a4a')),pt('d','Sọc trắng',r(0,2*H3,300,H3/2,'#fff'),{k:'w'}),pt('e','Sọc đỏ',r(0,2.5*H3,300,H3/2,'#a51931'),{k:'r'})]),
F('se','Thụy Điển','Xtốc-khôm','châu Âu',2,300,200,[pt('bg','Nền xanh',r(0,0,300,200,'#006aa7')),pt('v','Thanh vàng dọc',r(94,0,37.5,200,'#fecc00')),
  pt('h','Thanh vàng ngang',r(0,81.25,300,37.5,'#fecc00'))]),
F('ca','Canada','Ốt-ta-oa','châu Mỹ',2,300,200,[pt('a','Sọc đỏ',r(0,0,75,200,'#d52b1e'),{k:'r'}),pt('b','Nền trắng',r(75,0,150,200,'#fff')),
  pt('c','Sọc đỏ',r(225,0,75,200,'#d52b1e'),{k:'r'}),pt('d','Lá phong đỏ',pg(MAPLE,'#d52b1e'))]),
F('ch','Thụy Sĩ','Béc-nơ','châu Âu',2,200,200,[pt('bg','Nền đỏ',r(0,0,200,200,'#da291c')),pt('v','Thanh trắng dọc',r(80,40,40,120,'#fff')),
  pt('h','Thanh trắng ngang',r(40,80,120,40,'#fff'))]),

/* ===== âm thanh ===== */
function tone(k){
  if(!soundOn)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  if(actx.state==='suspended')actx.resume();
  const n=actx.currentTime,F={pick:[520],ok:[660,990],bad:[240,180],win:[660,880,1100,1320,1560]}[k]||[440];
  F.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=k==='bad'?'square':'triangle';o.frequency.value=f;
    const t=n+i*.09;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(k==='bad'?.07:.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.2)});
}
let viVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();viVoice=v.find(x=>/^vi/i.test(x.lang))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t,cb){
  let done=false;const fin=()=>{if(done)return;done=true;cb&&cb()};
  if(!soundOn||!('speechSynthesis' in window)){setTimeout(fin,400);return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';if(viVoice)u.voice=viVoice;u.rate=.95;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)}catch(e){}
  setTimeout(fin,1200+t.length*85);
}
function setSound(){$('#sound').innerHTML=soundOn?ICON_ON:ICON_OFF}
$('#sound').onclick=()=>{soundOn=!soundOn;if(!soundOn&&'speechSynthesis' in window)speechSynthesis.cancel();setSound()};

/* ===== dựng mảnh theo khối lớp =====
   mỗi bộ phận {id,n,lv,p,k,s,bb}: lv > khối thì gộp vào bộ phận cha p.
   k: các mảnh cùng k (và không gộp gì thêm) giống hệt nhau nên đặt chỗ nào cũng được. */
function measure(s){meas.innerHTML='<g>'+s+'</g>';const b=meas.firstChild.getBBox();return {x:b.x,y:b.y,w:b.width,h:b.height}}
function union(a,b){if(!a)return b;const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y);return {x,y,w:Math.max(a.x+a.w,b.x+b.w)-x,h:Math.max(a.y+a.h,b.y+b.h)-y}}
const cache={};
function buildPieces(it,g){
  const ck=it.id+'|'+g;
  if(!cache[ck]){
    const by={};it.parts.forEach((p,i)=>{p.i=i;by[p.id]=p});
    const groups=new Map();
    it.parts.forEach(p=>{let q=p;while((q.lv||1)>g&&q.p&&by[q.p])q=by[q.p];
      if(!groups.has(q.id))groups.set(q.id,{root:q,list:[]});groups.get(q.id).list.push(p)});
    const out=[];
    groups.forEach(({root,list})=>{
      let bb=null;
      list.forEach(p=>{if(!p._bb)p._bb=p.bb?{x:p.bb[0],y:p.bb[1],w:p.bb[2],h:p.bb[3]}:measure(p.s);bb=union(bb,p._bb)});
      const pad=GAME.pad;bb={x:bb.x-pad,y:bb.y-pad,w:bb.w+2*pad,h:bb.h+2*pad};
      out.push({uid:it.id+'-'+root.id,item:it,name:root.n,z:list[0].i,
        k:it.id+'-'+((list.length===1&&root.k)?root.k:root.id),
        markup:list.map(p=>p.s).join(''),bb,cx:bb.x+bb.w/2,cy:bb.y+bb.h/2});
    });
    cache[ck]=out.sort((a,b)=>a.z-b.z);
  }
  return cache[ck].map(p=>({...p,done:false,used:false,wc:0}));
}
function pickDistractors(n){
  if(!n)return [];
  const mine=new Set(pieces.map(p=>p.markup)),area=cur.W*cur.H,pool=[];
  itemsFor(lop).forEach(o=>{if(o===cur)return;buildPieces(o,lop).forEach(p=>{
    if(mine.has(p.markup)||p.bb.w*p.bb.h>.3*area)return;
    if(GAME.kind==='flag'&&/^<(rect|svg)/.test(p.markup))return;
    pool.push(p)})});
  return shuffle(pool).slice(0,n).map(p=>({...p,fake:true,uid:'x-'+p.uid}));
}

/* ===== vào chơi ===== */
function startItem(i){
  const list=itemsFor(lop);curIdx=(i+list.length)%list.length;cur=list[curIdx];
  cancelDrag();clearTimeout(winT);
  pieces=buildPieces(cur,lop);
  tray=shuffle([...pieces.map(p=>p),...pickDistractors(CFG[lop].dis)]);
  score=0;mistakes=0;hints=0;won=false;
  show('play');scrollTo(0,0);
  $('#itemName').textContent=GAME.label(cur);
  $('#ref').innerHTML=fullSVG(cur);
  renderBoard();sizeBoard();renderTray();updHud();updHint();
  t0=Date.now();clearInterval(timerId);timerId=setInterval(updTime,500);updTime();
  speak(GAME.intro(cur));
}
function renderBoard(){
  const it=cur,c=CFG[lop];
  board.setAttribute('viewBox',`0 0 ${it.W} ${it.H}`);
  board.setAttribute('class','L'+lop);
  board.innerHTML=GAME.bg(it,false)+
    '<g id="slots">'+pieces.map(p=>`<g data-s="${p.uid}">${c.ghost?`<g opacity="${c.ghost}">${p.markup}</g>`:''}</g>`).join('')+'</g>'+
    '<g id="lines">'+pieces.map(p=>`<g class="gl" data-l="${p.uid}">${p.markup}</g>`).join('')+'</g>';
}
function sizeBoard(){
  const wrap=$('#boardWrap'),it=cur,narrow=innerWidth<=820;
  const aw=wrap.clientWidth-20;
  let ah=narrow?innerHeight*.5:innerHeight-wrap.getBoundingClientRect().top-34;
  ah=Math.max(ah,220);
  S=Math.max(.3,Math.min(aw/it.W,ah/it.H));
  board.style.width=(it.W*S)+'px';board.style.height=(it.H*S)+'px';
}
function renderTray(){
  const el=$('#tray');el.innerHTML='';
  const cap=innerWidth<=820?84:GAME.thumbMax;
  tray.forEach(p=>{
    if(p.used)return;
    const d=document.createElement('div');d.className='pc';
    const s=Math.min(S*.8,cap/Math.max(p.bb.w,p.bb.h));
    d.innerHTML=`<div class="pi">${psvg(p,s)}</div><div class="pn">${p.name}</div>`;
    d.addEventListener('pointerdown',e=>grab(e,p,d));
    el.appendChild(d);p.el=d;
  });
}
function updHud(){$('#score').textContent=score;$('#left').textContent=pieces.filter(p=>!p.done).length}
function updHint(){$('#hintTxt').textContent='Gợi ý ('+(3-hints)+')'}
function updTime(){const s=Math.floor((Date.now()-t0)/1000);$('#time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function tol(){return CFG[lop].tol*Math.max(cur.W,cur.H)/400}
let msgT=0;
function msg(t){const m=$('#msg');m.textContent=t;m.classList.add('on');clearTimeout(msgT);msgT=setTimeout(()=>m.classList.remove('on'),1800)}
function flash(k){pieces.forEach(s=>{if(s.done||s.k!==k)return;const l=board.querySelector(`[data-l="${s.uid}"]`);
  if(l){l.classList.add('flash');setTimeout(()=>l.classList.remove('flash'),2600)}})}

/* ===== kéo thả (Pointer Events: chuột + cảm ứng) ===== */
function grab(e,p,cell){
  if(drag||won)return;
  e.preventDefault();
  const r=cell.querySelector('svg').getBoundingClientRect();
  const fx=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),fy=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
  const fl=document.createElement('div');fl.className='float';fl.innerHTML=psvg(p,S);document.body.appendChild(fl);
  drag={p,cell,fl,w:p.bb.w*S,h:p.bb.h*S,fx,fy,id:e.pointerId,x:0,y:0};
  mv(e.clientX,e.clientY);cell.classList.add('lifted');tone('pick');
  addEventListener('pointermove',onMove,{passive:false});addEventListener('pointerup',onUp);addEventListener('pointercancel',onUp);
}
function mv(x,y){drag.x=x-drag.fx*drag.w;drag.y=y-drag.fy*drag.h;drag.fl.style.transform=`translate(${drag.x}px,${drag.y}px)`}
function onMove(e){if(drag&&e.pointerId===drag.id){e.preventDefault();mv(e.clientX,e.clientY)}}
function unbind(){removeEventListener('pointermove',onMove);removeEventListener('pointerup',onUp);removeEventListener('pointercancel',onUp)}
function cancelDrag(){if(!drag)return;unbind();drag.fl.remove();drag.cell.classList.remove('lifted');drag=null}
function onUp(e){
  if(!drag||e.pointerId!==drag.id)return;
  unbind();
  const d=drag;drag=null;
  if(e.type==='pointercancel')return back(d);
  const br=board.getBoundingClientRect();
  const cx=d.x+d.w/2,cy=d.y+d.h/2,bx=(cx-br.left)/S,by=(cy-br.top)/S;
  if(!d.p.fake){
    let bs=null,bd=1e9;
    pieces.forEach(s=>{if(!s.done&&s.k===d.p.k){const q=Math.hypot(s.cx-bx,s.cy-by);if(q<bd){bd=q;bs=s}}});
    if(bs&&bd<=tol())return place(d,bs);
  }
  const inB=(x,y)=>x>br.left&&x<br.right&&y>br.top&&y<br.bottom;
  if(inB(cx,cy)||inB(e.clientX,e.clientY))wrong(d);else back(d);
}
function back(d){
  const r=d.cell.getBoundingClientRect();
  d.fl.style.transition='transform .22s ease-in,opacity .22s';
  d.fl.style.transform=`translate(${r.left+r.width/2-d.w/2}px,${r.top+r.height/2-d.h/2}px) scale(.45)`;d.fl.style.opacity='.3';
  setTimeout(()=>{d.fl.remove();d.cell.classList.remove('lifted')},230);
}
function place(d,s){
  const br=board.getBoundingClientRect(),tx=br.left+s.bb.x*S,ty=br.top+s.bb.y*S;
  d.fl.style.transition='transform .15s ease-out';d.fl.style.transform=`translate(${tx}px,${ty}px)`;
  d.p.used=true;s.done=true;d.cell.remove();
  const gain=d.p.wc?5:10;score+=gain;
  setTimeout(()=>{d.fl.remove();
    const g=board.querySelector(`[data-s="${s.uid}"]`);g.innerHTML=s.markup;g.classList.add('pop');
    const l=board.querySelector(`[data-l="${s.uid}"]`);if(l)l.remove()},160);
  const pl=document.createElement('div');pl.className='plus';pl.textContent='+'+gain;
  pl.style.left=(tx+s.bb.w*S/2-20)+'px';pl.style.top=(ty+s.bb.h*S/2-20)+'px';document.body.appendChild(pl);setTimeout(()=>pl.remove(),950);
  tone('ok');updHud();
  if(pieces.every(q=>q.done)){winT=setTimeout(win,450);return}
  if(!tray.some(p=>!p.used&&!p.fake))return;
  if(lop<=2)speak(s.name);
}
function wrong(d){
  mistakes++;tone('bad');
  const p=d.p;
  if(p.fake)msg(`Mảnh này không phải của ${GAME.of(cur)}!`);
  else{p.wc++;msg(p.wc>=2?'Nhìn chỗ đang nhấp nháy nhé!':'Chưa đúng chỗ, thử lại nhé!');if(p.wc>=2)flash(p.k)}
  back(d);setTimeout(()=>{d.cell.classList.add('shake');setTimeout(()=>d.cell.classList.remove('shake'),420)},240);
}
$('#hint').onclick=()=>{
  if(won||!cur)return;
  if(hints>=3){msg('Hết lượt gợi ý rồi!');return}
  const rem=tray.filter(p=>!p.used&&!p.fake);if(!rem.length)return;
  const p=rem[Math.random()*rem.length|0];hints++;updHint();
  p.el.classList.add('glow');setTimeout(()=>p.el.classList.remove('glow'),2600);
  try{p.el.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}
  flash(p.k);
};
$('#redo').onclick=()=>startItem(curIdx);
$('#toGal').onclick=()=>{cancelDrag();clearInterval(timerId);clearTimeout(winT);renderHome();show('home')};

/* ===== hoàn thành ===== */
function confetti(){
  const box=$('#conf'),cols=['#f97316','#ec4899','#22c55e','#3b82f6','#eab308','#a855f7'];
  for(let i=0;i<90;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'vw';s.style.background=cols[i%6];
    s.style.animationDelay=Math.random()*.6+'s';s.style.animationDuration=1.8+Math.random()*1.4+'s';box.appendChild(s);setTimeout(()=>s.remove(),4000)}
}
function win(){
  if(won)return;won=true;clearInterval(timerId);
  const st=mistakes<=1?3:mistakes<=4?2:1,key=lop+':'+cur.id;
  if((best[key]||0)<st){best[key]=st;saveBest()}
  const ln=board.querySelector('#lines');if(ln)ln.remove();
  board.classList.add(GAME.kind==='flag'?'wave':'dance');
  $('#tray').innerHTML='<div class="tray-done">Hoàn thành!</div>';
  tone('win');confetti();
  winT=setTimeout(()=>{
    $('#wstars').innerHTML=starsHTML(st);$('#wpic').innerHTML=fullSVG(cur);
    $('#wname').textContent=GAME.label(cur);$('#wfact').textContent=GAME.fact(cur);
    $('#wstat').textContent=`Thời gian ${$('#time').textContent} · Điểm ${score} · Sai ${mistakes} lần`;
    $('#win').hidden=false;speak('Tuyệt vời! '+GAME.say(cur));
  },1300);
}
$('#wAgain').onclick=()=>startItem(curIdx);
$('#wNext').onclick=()=>startItem(curIdx+1);
$('#wList').onclick=()=>{renderHome();show('home')};

addEventListener('resize',()=>{if(!$('#play').hidden&&cur&&!drag){sizeBoard();renderTray()}});

setSound();setBack();renderHome();show('home');
</script>
