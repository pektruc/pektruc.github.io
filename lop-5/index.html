<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lớp 5 - Trò Chơi Học Tập</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);min-height:100vh;padding:70px 20px 40px;color:#fff;
            display:flex;flex-direction:column;align-items:center;justify-content:center}
        .back-home{position:fixed;top:16px;left:16px;color:#cbd5e1;text-decoration:none;font-size:14px;font-weight:600;
            background:rgba(255,255,255,.08);padding:9px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.14)}
        .back-home:hover{color:#fff;background:rgba(255,255,255,.16)}
        h1{text-align:center;font-size:2.4rem;margin-bottom:10px;
            background:linear-gradient(90deg,#fb7185,#f43f5e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        .subtitle{text-align:center;color:#94a3b8;margin-bottom:46px}
        .cards{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;max-width:900px}
        .card{background:rgba(255,255,255,.1);border-radius:20px;padding:40px 30px;width:270px;text-align:center;
            text-decoration:none;color:#fff;transition:transform .3s,box-shadow .3s;backdrop-filter:blur(10px);
            border:1px solid rgba(251,113,133,.25)}
        .card:hover{transform:translateY(-10px);box-shadow:0 20px 40px rgba(244,63,94,.2)}
        .card-icon{font-size:80px;margin-bottom:20px;display:block}
        .card-title{font-size:1.3rem;font-weight:700;margin-bottom:10px;color:#fb7185}
        .card-desc{font-size:14px;color:#94a3b8;line-height:1.5}
        .card-badge{display:inline-block;background:linear-gradient(90deg,#f43f5e,#fb7185);padding:5px 15px;border-radius:20px;font-size:12px;margin-top:15px;font-weight:500}
        .footer{margin-top:60px;text-align:center;color:#64748b;font-size:14px}
        .footer p{margin:5px 0}.footer strong{color:#94a3b8}
        @media(max-width:600px){h1{font-size:1.8rem}.card{width:100%;max-width:300px;padding:30px 20px}.card-icon{font-size:60px}}
    </style>
</head>
<body>
    <a href="../index.html" class="back-home">← Trang chủ</a>
    <h1>Lớp 5</h1>
    <p class="subtitle">Trò chơi học tập dành cho học sinh lớp 5</p>

    <div class="cards">
        <a href="../game-chung/robot-nhat-vang/?lop=5" class="card">
            <span class="card-icon"><svg width="80" height="80" viewBox="0 0 72 72" fill="none">
              <circle cx="54" cy="20" r="12" fill="#ffd257" stroke="#c99a2e" stroke-width="2.4"/>
              <circle cx="54" cy="20" r="7" fill="none" stroke="#c99a2e" stroke-width="2"/>
              <line x1="24" y1="11" x2="24" y2="18" stroke="#8892a3" stroke-width="2.4"/><circle cx="24" cy="9" r="3.6" fill="#ff5a5a"/>
              <rect x="11" y="18" width="28" height="20" rx="6" fill="#dfe9f5" stroke="#28344a" stroke-width="2.4"/>
              <circle cx="20" cy="28" r="2.4" fill="#28344a"/><circle cx="30" cy="28" r="2.4" fill="#28344a"/>
              <rect x="13" y="40" width="24" height="22" rx="6" fill="#8ea4be" stroke="#28344a" stroke-width="2.4"/>
              <circle cx="25" cy="51" r="6" fill="#5de8ff" stroke="#28344a" stroke-width="1.6"/>
              <rect x="3" y="42" width="8" height="16" rx="3" fill="#5de8ff" stroke="#28344a" stroke-width="1.6"/>
              <rect x="39" y="42" width="8" height="16" rx="3" fill="#5de8ff" stroke="#28344a" stroke-width="1.6"/>
            </svg></span>
            <h2 class="card-title">Rô Bốt Nhặt Vàng</h2>
            <p class="card-desc">Rô bốt tự chạy trên đường; đổi làn, nhảy, trượt để né chướng ngại và gom thật nhiều vàng. Chạy càng xa điểm càng cao, có lưu kỷ lục</p>
            <span class="card-badge">Chạy vô tận</span>
        </a>
    </div>

    <footer class="footer">
        <p>Thiết kế bởi <strong>Bùi Thị Phương Trúc</strong></p>
        <p>Trường Trung-Tiểu học Pétrus Ký</p>
    </footer>
</body>
</html>
