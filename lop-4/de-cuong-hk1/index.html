<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đề Cương Ôn Tập HK1 - Tin Học 4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#1e2a5a;--xanh:#16a34a;--xanhd:#166534;--do:#dc2626;--chon:#2563eb;--vien:#cbd5e1}
body{font-family:Arial,'Segoe UI',sans-serif;background:#f1f5f9;color:var(--navy);padding:14px 16px 40px}
.wrap{max-width:900px;margin:0 auto}
.back{display:inline-block;background:#fff;border:2px solid var(--navy);color:var(--navy);text-decoration:none;font-weight:bold;padding:7px 14px;border-radius:20px;font-size:15px;margin-bottom:12px}
.back:hover{background:#eef2ff}
.giay{background:#fff;border-radius:16px;box-shadow:0 6px 20px rgba(30,42,90,.1);padding:26px 28px}
h1{text-align:center;font-size:clamp(20px,3vw,28px);line-height:1.35}
.sub{text-align:center;font-weight:bold;font-size:clamp(15px,2vw,19px);margin-top:4px}
h2{font-size:20px;margin:22px 0 4px}
.note{font-style:italic;color:#475569;margin-bottom:8px}
.cau{border-top:1px solid #e2e8f0;padding:16px 0}
.cau.thieu{background:#fffbeb;border-radius:10px;padding:16px 10px;margin:0 -10px}
.qt{font-size:18px;line-height:1.5;margin-bottom:10px}
.qt b{white-space:nowrap}
.opts{display:grid;gap:8px}
.opts.c2{grid-template-columns:1fr 1fr}
.opts.c4{grid-template-columns:repeat(4,1fr)}
.opt{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--vien);border-radius:12px;padding:9px 12px;font:inherit;font-size:17px;color:var(--navy);cursor:pointer;text-align:left}
.opt:hover:not(:disabled){border-color:var(--chon)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--navy);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px}
.opt.pic{flex-direction:column;justify-content:center}
.opt.pic img{height:64px;max-width:100%;object-fit:contain}
.opt.chon{border-color:var(--chon);background:#eff6ff}
.opt.chon .k{background:var(--chon);border-color:var(--chon);color:#fff}
.opt.dung{border-color:var(--xanh);background:#dcfce7}
.opt.dung .k{background:var(--xanh);border-color:var(--xanh);color:#fff}
.opt.sai{border-color:var(--do);background:#fee2e2}
.opt.sai .k{background:var(--do);border-color:var(--do);color:#fff}
.opt:disabled{cursor:default}
.kq{margin-top:8px;font-weight:bold;font-size:16px}
.kq.ok{color:var(--xanhd)}.kq.no{color:var(--do)}

/* câu nối */
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:24%;row-gap:10px;max-width:640px;margin:0 auto}
.match .th{text-align:center;font-weight:bold}
.match svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mi{position:relative;display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--vien);border-radius:12px;padding:6px 12px;min-height:84px;font:inherit;font-size:17px;color:var(--navy);cursor:pointer;text-align:left}
.mi:hover:not(:disabled){border-color:var(--chon)}
.mi img{height:66px;max-width:70%;object-fit:contain}
.mi .k{flex:none;font-weight:bold;min-width:22px}
.mi.chon{border-color:var(--chon);background:#eff6ff}
.mi:disabled{cursor:default}
.day{stroke-width:4;stroke-linecap:round;stroke:var(--chon)}
.dot{fill:var(--chon)}
.day.ok{stroke:var(--xanh)}.dot.ok{fill:var(--xanh)}
.day.sai{stroke:var(--do)}.dot.sai{fill:var(--do)}
.hd{text-align:center;color:#64748b;font-size:15px;margin-top:8px}

.row{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{background:var(--navy);color:#fff;border:none;border-radius:999px;padding:13px 34px;font:inherit;font-size:18px;font-weight:bold;cursor:pointer}
.btn:hover{opacity:.9}
.btn.phu{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn[hidden]{display:none}
.tong{margin-top:18px;text-align:center;font-size:22px;font-weight:bold;padding:14px;border-radius:12px;background:#eff6ff}
.tong[hidden]{display:none}
.canh{text-align:center;color:#b45309;font-weight:bold;margin-top:12px;min-height:22px}

@media(max-width:640px){
  .giay{padding:18px 14px}
  .opts.c2{grid-template-columns:1fr}
  .opts.c4{grid-template-columns:1fr 1fr}
  .match{column-gap:14%}
  .mi{flex-direction:column;justify-content:center;text-align:center;gap:4px;padding:6px}
  .mi img{height:52px;max-width:100%}
}
</style>
</head>

const KEYS = ['A','B','C','D'], CHU = ['a','b','c','d'];
const $ = id => document.getElementById(id);
let traLoi = [], daNop = false;
let noi = null; /* câu nối: {k, m, chonL, chonR, cap:{trái: phải}} */

function veDe(){
  traLoi = DE.map(c => c.t === 'noi' ? null : -1);
  daNop = false;
  const de = $('de'); de.innerHTML = '';
  DE.forEach((c, k) => {
    const box = document.createElement('div');
    box.className = 'cau'; box.id = 'cau' + k;
    const qt = document.createElement('p');
    qt.className = 'qt';
    qt.innerHTML = '<b>Câu ' + (k+1) + '.</b> <span></span>';
    qt.lastChild.textContent = c.q;
    box.appendChild(qt);
    if(c.t === 'noi') veNoi(c, k, box);
    else veChon(c, k, box);
    const kq = document.createElement('p'); kq.className = 'kq'; kq.hidden = true;
    box.appendChild(kq);
    de.appendChild(box);
  });
  $('tong').hidden = true; $('canh').textContent = '';
  $('btnNop').hidden = false; $('btnLai').hidden = true;
}

function veChon(c, k, box){
  const g = document.createElement('div');
  if(c.pic){
    g.className = 'opts c4';
    c.pic.forEach((n, i) => {
      const b = document.createElement('button');
      b.className = 'opt pic';
      b.innerHTML = '<span class="k">' + KEYS[i] + '</span><img alt="Hình ' + KEYS[i] + '" src="' + IMG[n] + '">';
      b.onclick = () => chon(k, i);
      g.appendChild(b);
    });
  } else {
    const dai = Math.max(...c.o.map(x => x.length));
    g.className = 'opts' + (dai <= 12 ? ' c4' : dai <= 40 ? ' c2' : '');
    c.o.forEach((x, i) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = '<span class="k">' + KEYS[i] + '</span><span></span>';
      b.lastChild.textContent = x;
      b.onclick = () => chon(k, i);
      g.appendChild(b);
    });
  }
  box.appendChild(g);
}
function chon(k, i){
  if(daNop) return;
  traLoi[k] = i;
  document.querySelectorAll('#cau' + k + ' .opt').forEach((b, j) => b.classList.toggle('chon', j === i));
  $('cau' + k).classList.remove('thieu');
}

/* ----- câu nối ----- */
function veNoi(c, k, box){
  const m = document.createElement('div');
  m.className = 'match';
  m.innerHTML = '<div class="th">Nút lệnh</div><div class="th">Chức năng</div>';
  noi = {k, c, m, chonL:null, chonR:null, cap:{}};
  for(let r = 0; r < 4; r++){
    const L = document.createElement('button');
    L.className = 'mi'; L.dataset.i = r;
    L.innerHTML = '<span class="k">' + (r+1) + '.</span><img alt="Nút lệnh ' + (r+1) + '" src="' + IMG[c.L[r]] + '">';
    L.onclick = () => bamNoi('L', r);
    const R = document.createElement('button');
    R.className = 'mi'; R.dataset.j = r;
    R.innerHTML = '<span class="k">' + CHU[r] + '.</span><span></span>';
    R.lastChild.textContent = c.R[r];
    R.onclick = () => bamNoi('R', r);
    m.append(L, R);
  }
  m.insertAdjacentHTML('beforeend', '<svg aria-hidden="true"></svg>');
  box.appendChild(m);
  const hd = document.createElement('p'); hd.className = 'hd';
  hd.textContent = 'Chạm một nút lệnh rồi chạm chức năng để nối. Nối lại sẽ thay dây cũ.';
  box.appendChild(hd);
}
const oL = i => noi.m.querySelector('.mi[data-i="' + i + '"]');
const oR = j => noi.m.querySelector('.mi[data-j="' + j + '"]');
function bamNoi(ben, r){
  if(daNop) return;
  if(ben === 'L') noi.chonL = noi.chonL === r ? null : r;
  else noi.chonR = noi.chonR === r ? null : r;
  if(noi.chonL !== null && noi.chonR !== null){
    const i = noi.chonL, j = noi.chonR;
    for(const x in noi.cap) if(noi.cap[x] === j) delete noi.cap[x];
    noi.cap[i] = j;
    noi.chonL = noi.chonR = null;
    $('cau' + noi.k).classList.remove('thieu');
  }
  noi.m.querySelectorAll('.mi').forEach(x => x.classList.remove('chon'));
  if(noi.chonL !== null) oL(noi.chonL).classList.add('chon');
  if(noi.chonR !== null) oR(noi.chonR).classList.add('chon');
  veDay();
}
function veDay(){
  if(!noi) return;
  const svg = noi.m.querySelector('svg'), r0 = noi.m.getBoundingClientRect();
  let h = '';
  for(const i in noi.cap){
    const j = noi.cap[i];
    const cls = daNop ? (noi.c.a[i] === j ? ' ok' : ' sai') : '';
    const a = oL(+i).getBoundingClientRect(), b = oR(j).getBoundingClientRect();
    const x1 = a.right - r0.left, y1 = a.top + a.height/2 - r0.top;
    const x2 = b.left - r0.left, y2 = b.top + b.height/2 - r0.top;
    h += '<line class="day' + cls + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/>'
       + '<circle class="dot' + cls + '" cx="' + x1 + '" cy="' + y1 + '" r="6"/><circle class="dot' + cls + '" cx="' + x2 + '" cy="' + y2 + '" r="6"/>';
  }
  svg.innerHTML = h;
}
window.addEventListener('resize', veDay);

/* ----- nộp bài ----- */
function daLam(k){ return DE[k].t === 'noi' ? Object.keys(noi.cap).length === 4 : traLoi[k] >= 0; }
function dapAnChu(c){
  if(c.t === 'noi') return c.a.map((j, i) => (i+1) + ' – ' + CHU[j]).join('; ') + '.';
  return KEYS[c.a] + (c.pic ? '' : '. ' + c.o[c.a]);
}
function nop(){
  const thieu = DE.map((c, k) => k).filter(k => !daLam(k));
  if(thieu.length && $('canh').dataset.hoi !== '1'){
    thieu.forEach(k => $('cau' + k).classList.add('thieu'));
    $('canh').textContent = 'Em chưa làm câu ' + thieu.map(k => k+1).join(', ') + '. Bấm Nộp bài lần nữa nếu vẫn muốn nộp.';
    $('canh').dataset.hoi = '1';
    $('cau' + thieu[0]).scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  daNop = true; $('canh').textContent = ''; $('canh').dataset.hoi = '';
  document.querySelectorAll('.hd').forEach(x => x.hidden = true);
  let dung = 0;
  DE.forEach((c, k) => {
    const box = $('cau' + k), kq = box.querySelector('.kq');
    box.classList.remove('thieu');
    let ok;
    if(c.t === 'noi'){
      ok = c.a.every((j, i) => noi.cap[i] === j);
      noi.m.querySelectorAll('.mi').forEach(x => { x.disabled = true; x.classList.remove('chon'); });
      veDay();
    } else {
      ok = traLoi[k] === c.a;
      box.querySelectorAll('.opt').forEach((b, i) => {
        b.disabled = true; b.classList.remove('chon');
        if(i === c.a) b.classList.add('dung');
        else if(i === traLoi[k]) b.classList.add('sai');
      });
    }
    if(ok) dung++;
    kq.hidden = false;
    kq.className = 'kq ' + (ok ? 'ok' : 'no');
    kq.textContent = ok ? 'Đúng' : (daLam(k) ? 'Sai' : 'Chưa làm') + ' – Đáp án: ' + dapAnChu(c);
  });
  $('tong').hidden = false;
  $('tong').textContent = 'Kết quả: đúng ' + dung + '/' + DE.length + ' câu';
  $('btnNop').hidden = true; $('btnLai').hidden = false;
  $('tong').scrollIntoView({behavior:'smooth', block:'center'});
}

$('btnNop').onclick = nop;
$('btnLai').onclick = () => { veDe(); window.scrollTo({top:0, behavior:'smooth'}); };
veDe();
</script>
</body>
</html>
